<div class="flex h-screen w-full relative bg-surface text-on-surface font-sans">
  <app-panel-lateral></app-panel-lateral>
  <div class="flex w-full h-screen">
  <!-- Área Principal de Contenido -->
    <main class="flex-1 flex flex-col h-screen relative z-10 overflow-y-auto">
      
      <!-- TopNavBar -->
      <header class="flex justify-between items-center w-full px-6 h-20 sticky top-0 z-50 bg-surface/80 backdrop-blur-md border-b-4 border-on-surface shadow-[-6px_-6px_12px_rgba(255,255,255,0.8),6px_6px_12px_rgba(0,0,0,0.1)]">
        <div class="flex items-center gap-6">
          <span class="text-2xl font-black uppercase tracking-tighter text-on-surface">PropManager Pro</span>
          <div class="hidden lg:flex items-center ml-8 space-x-6">
            <a href="#" class="text-primary font-black underline decoration-4 underline-offset-4 text-sm uppercase">Register</a>
            <a href="#" class="text-secondary font-bold uppercase text-sm hover:bg-surface-container-highest transition-all duration-200 px-3 py-1">Overview</a>
            <a href="#" class="text-secondary font-bold uppercase text-sm hover:bg-surface-container-highest transition-all duration-200 px-3 py-1">Analytics</a>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <button type="button" class="p-3 rounded-full neu-raised hover:bg-surface-container-highest active:translate-y-1 transition-all">
            <span class="material-symbols-outlined text-primary">notifications</span>
          </button>

          <button type="button" class="p-3 rounded-full neu-raised hover:bg-surface-container-highest active:translate-y-1 transition-all">
            <span class="material-symbols-outlined text-primary">settings</span>
          </button>

          <!-- TODO [LÓGICA - AVATAR]: Renderizar [src]="currentUser().avatarUrl" dinámicamente -->
          <div class="w-10 h-10 rounded-full border-2 border-on-surface bg-surface-container-high ml-2 overflow-hidden shadow-sm">
            <img 
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuA9_DXtbY52-7i7o51pkGNazMGLk_lp8nrrDf6o2326UnC-mGXBsC4Q3D8tqBr4nMJ8jchym2-5z3mkOs0eNqJ_vyrXxC8Y8hqIZW2413ors9ScbRad5WTRisXFb0rlHqfBU0vJqUFuxPvAC1jR3GiJgfkN3S480EMtekqxSa6gNKpfqWujzBAhfHuPFmtoRha2riQ4-Z63qGLiPuc9nthjHsSMeI4uWg-kuqlkA2PONw7LRbR0Ok72OA" 
              alt="Usuario Administrador" 
              class="w-full h-full object-cover" 
            />
          </div>
        </div>
      </header>

      <!-- Contenido del Formulario -->
      <div class="flex-1 flex flex-col items-center justify-center p-2">
        <div class="w-full max-w-2xl p-3">
          
          <!-- Título Principal -->
          <h2 class="text-3xl lg:text-4xl font-black uppercase italic text-white brutal-title mb-8 tracking-tight">
            REGISTRAR LOCAL
          </h2>

          <!-- Formulario en Tarjeta Glassmorphism -->
          <div class="glass-card rounded-xl p-6 lg:p-10 shadow-2xl relative overflow-hidden">
            
            <!-- TODO [LÓGICA - FORMULARIO]: Vincular con ReactiveForms mediante [formGroup]="registerLocalForm" y (ngSubmit)="onSubmitLocal()" -->
            <form [formGroup]="LocalForm" (ngSubmit)="onSubmit()" class="space-y-6">
              
              <!-- Selector de Propiedad con Estado Carga / Skeleton -->
              <div class="space-y-2">
                <label class="text-sm text-black uppercase font-black tracking-widest pl-2">Propiedad</label>
                <div class="relative group">
                  <div class="w-full h-14 neu-pressed rounded-full flex items-center px-6 border border-white/10 overflow-hidden relative">
                    
                    @if (loadingProperties()) {
                      <div class="flex items-center gap-3 z-10 w-full">
                        <div class="animate-spin text-primary-container">
                          <span class="material-symbols-outlined">progress_activity</span>
                        </div>
                        <span class="text-on-surface-variant font-bold italic animate-pulse">Cargando propiedades...</span>
            
                      </div>
                    } @else {
                      <select 
                        formControlName="propiedadId"
                        class="w-full h-full bg-surface border-none focus:outline-none text-on-surface font-bold cursor-pointer"
                      >
                        <option value="">Selecciona una propiedad</option>
                        @for (prop of propiedades(); track prop.id) {
                          <option [value]="prop.id">{{ prop.nombre }}</option>
                        }
                      </select>
                    }
                    
                  </div>
                </div>
              </div>

              <!-- Nombre del local -->
              <div class="space-y-2">
                <label class="text-sm text-black uppercase font-black tracking-widest pl-2">Nombre del local</label>
                <input 
                  type="text" 
                  formControlName="nombreLocal"
                  placeholder="Ej. Suite 104 - Retail A" 
                  class="w-full h-14 neu-pressed rounded-full bg-surface border-none focus:outline-none focus:ring-4 focus:ring-primary-container/30 text-on-surface font-bold px-6 transition-all"
                />
              </div>

              <!-- Descripción -->
              <div class="space-y-2">
                <label class="text-sm text-black uppercase font-black tracking-widest pl-2">Descripción</label>
                <textarea 
                  rows="3" 
                  formControlName="descripcion"
                  placeholder="Detalles sobre el local, acabados o restricciones..." 
                  class="w-full neu-pressed rounded-xl bg-surface border-none focus:outline-none focus:ring-4 focus:ring-primary-container/30 text-on-surface font-medium p-4 transition-all resize-none"
                ></textarea>
              </div>

              <!-- Área m² -->
              <div class="space-y-2">
                <label class="text-sm text-black uppercase font-black tracking-widest pl-2">Área m²</label>
                <div class="relative">
                  <input 
                    type="number" 
                    placeholder="0.00" 
                    formControlName="area"
                    class="w-full h-14 neu-pressed rounded-full bg-surface border-none focus:outline-none focus:ring-4 focus:ring-primary-container/30 text-on-surface font-bold px-6 transition-all pr-16"
                  />
                  <span class="absolute right-6 top-1/2 -translate-y-1/2 font-black text-secondary uppercase text-sm">SQM</span>
                </div>
              </div>

              <!-- Botón de Acción -->
              <div class="pt-4">
                <button 
                  type="submit" 
                  [disabled]="LocalForm.invalid"
                  class="w-full h-16 neu-btn-primary text-white font-black text-xl rounded-full flex items-center justify-center gap-4 transform hover:-translate-y-1 active:translate-y-1 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  <span class="material-symbols-outlined active-icon">add_business</span>
                  REGISTRAR LOCAL
                </button>
              </div>

            </form>

            <!-- Destellos decorativos para efecto Glassmorphism -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-primary-container/20 blur-3xl rounded-full pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-white/10 blur-3xl rounded-full pointer-events-none"></div>

          </div>

          <!-- Badges de Información Auxiliar -->
          <div class="mt-8 flex flex-wrap gap-4 justify-center md:justify-start">
            <div class="neu-raised px-4 py-2 rounded-full flex items-center gap-2">
              <span class="material-symbols-outlined text-primary text-sm">info</span>
              <!-- TODO [LÓGICA - INTERPOLACIÓN]: Reemplazar por {{ availableSpacesCount }} espacios disponibles -->
              <span class="text-xs font-bold uppercase text-on-surface-variant">4 espacios disponibles</span>
            </div>

            <div class="neu-raised px-4 py-2 rounded-full flex items-center gap-2">
              <span class="material-symbols-outlined text-primary text-sm">verified</span>
              <span class="text-xs font-bold uppercase text-on-surface-variant">Validación automática</span>
            </div>
          </div>

        </div>
      </div>

      <!-- Navegación Inferior para Dispositivos Móviles -->
      <footer class="md:hidden flex justify-around items-center h-20 bg-surface/90 backdrop-blur-md border-t-2 border-on-surface w-full fixed bottom-0 z-50">
        <button type="button" class="flex flex-col items-center gap-1 text-secondary">
          <span class="material-symbols-outlined">dashboard</span>
          <span class="text-[10px] font-bold uppercase">Dash</span>
        </button>

        <button type="button" class="flex flex-col items-center gap-1 text-primary">
          <span class="material-symbols-outlined active-icon">domain</span>
          <span class="text-[10px] font-bold uppercase">Props</span>
        </button>

        <div class="-mt-12">
          <button type="button" class="w-16 h-16 bg-primary text-white rounded-full shadow-lg border-4 border-surface flex items-center justify-center">
            <span class="material-symbols-outlined text-3xl">add</span>
          </button>
        </div>

        <button type="button" class="flex flex-col items-center gap-1 text-secondary">
          <span class="material-symbols-outlined">group</span>
          <span class="text-[10px] font-bold uppercase">Users</span>
        </button>

        <button type="button" class="flex flex-col items-center gap-1 text-secondary">
          <span class="material-symbols-outlined">assessment</span>
          <span class="text-[10px] font-bold uppercase">Stats</span>
        </button>
      </footer>

    </main>
  </div>
  
</div>
